CONFIG_ZMK_SLEEP=y

# enable pinctrl
CONFIG_PINCTRL=y

# enable GPIO
CONFIG_GPIO=y

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Enable SPI (for WS2812)
CONFIG_SPI=y

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display (OLED SSD1306 via I2C - central side)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Reduce display refresh rate to minimize BLE latency impact.
# LVGL rendering + I2C transfer at 30fps causes nRF52840 scheduler pressure.
# 500ms = 2fps: display still updates, but BLE events get priority.
CONFIG_LV_DISP_DEF_REFR_PERIOD=500

CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_POINTING=y
