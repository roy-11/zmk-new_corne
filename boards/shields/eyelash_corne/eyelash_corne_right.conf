# Enable SPI (for WS2812)
CONFIG_SPI=y

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# Display disabled on peripheral side to reduce BLE split communication latency.
# The right half already handles key scanning + BLE split; display adds overhead.
CONFIG_ZMK_DISPLAY=n

CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
