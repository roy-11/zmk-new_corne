# Enable SPI (for WS2812)
CONFIG_SPI=y

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# Display (OLED SSD1306 via I2C - peripheral side)
# zmk-nice-oled removed, so this uses ZMK's built-in status screen.
# Lightweight event callbacks → no BLE lag impact.
CONFIG_ZMK_DISPLAY=y

CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
